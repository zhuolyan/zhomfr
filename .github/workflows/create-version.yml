name: Create Version

on:
  workflow_dispatch:

jobs:
  create_version:
    if: github.ref == 'refs/heads/master' && github.actor == 'zhuolyan'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        run: .github/scripts/determine-version.sh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release \
          --settings ./tests.runsettings \
          --collect:"XPlat Code Coverage" \
          --results-directory "cover"

      - name: Install ReportGenerator tool
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate badges and reports
        run: |
          reportgenerator \
            -reports:"cover/**/coverage.cobertura.xml" \
            -targetdir:"./.github/badges" \
            -reporttypes:"MarkdownSummary;Badges"

      - name: Generate README
        env:
          VERSION: ${{ env.VERSION }}
        run: python .github/scripts/generate-readme.py

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COVERAGE_BADGES_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_BADGES_PRIVATE_KEY }}

      - name: Commit and push release metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: .github/scripts/commit-release.sh

      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: .github/scripts/create-tag.sh